name: Quality gates

on:
  push:
    branches: [beta-next]
  pull_request:
    branches: [beta-next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Isolated browser tooling: no app install, database, secrets or app build.
      - run: npm install --prefix "$RUNNER_TEMP/profile-browser" --ignore-scripts --package-lock=false playwright@1.62.1
      - run: node "$RUNNER_TEMP/profile-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Focused profile readiness regression
        run: PROFILE_PLAYWRIGHT_MODULE="$RUNNER_TEMP/profile-browser/node_modules/playwright/index.mjs" node --test scripts/profileReadiness.test.mjs
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # No database server or production credentials in CI.
      DATABASE_URL: postgresql://build:build@127.0.0.1:1/build
      DIRECT_URL: postgresql://build:build@127.0.0.1:1/build
      SITE_URL: https://example.invalid
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run validate:cloud
      - run: git diff --check
